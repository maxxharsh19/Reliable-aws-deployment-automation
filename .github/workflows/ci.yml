name: Deployment Operations API - CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 02_CODEBASE/app

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest -v test_app.py

  publish:
    name: Build and Push to Amazon ECR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Login to Amazon ECR
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Build and push Docker image
        id: build-image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$GITHUB_SHA"

          docker build -t "$IMAGE_URI" ./02_CODEBASE/app
          docker push "$IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Verify ECR image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --region "$AWS_REGION"

      - name: Deploy Docker image to EC2 through SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
          INSTANCE_ID: i-086b6a6bcdda0519d
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/deploy-ec2.sh <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          IMAGE_URI="$1"
          AWS_REGION="$2"
          AWS_ACCOUNT_ID="$3"

          OLD_IMAGE="$(docker inspect --format '{{.Config.Image}}' deployment-ops-api 2>/dev/null || true)"

          rollback() {
            echo "Deployment failed. Restoring previous image: $OLD_IMAGE" >&2
            docker logs --tail 80 deployment-ops-api || true
            docker rm -f deployment-ops-api >/dev/null 2>&1 || true

            if [ -n "$OLD_IMAGE" ]; then
              if ! docker run -d --name deployment-ops-api --restart unless-stopped -p 80:5000 "$OLD_IMAGE"; then
                echo "Rollback container could not start" >&2
                exit 2
              fi

              for attempt in $(seq 1 12); do
                if curl -fsS --max-time 3 http://localhost/health >/dev/null; then
                  echo "Rollback successful: previous image restored"
                  exit 1
                fi
                sleep 5
              done

              echo "Rollback health check failed" >&2
              docker logs --tail 80 deployment-ops-api || true
              exit 2
            else
              echo "No previous image available for rollback" >&2
              exit 1
            fi
          }

          echo "Logging into Amazon ECR"

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          echo "Pulling new image: $IMAGE_URI"
          docker pull "$IMAGE_URI"

          docker rm -f deployment-ops-api >/dev/null 2>&1 || true

          if ! docker run -d --name deployment-ops-api --restart unless-stopped -p 80:5000 "$IMAGE_URI"; then
            rollback "New container failed to start"
          fi

          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 3 http://localhost/health >/dev/null; then
              echo "Deployment successful and healthy"
              exit 0
            fi

            echo "Health check attempt $attempt failed"
            sleep 5
          done

          rollback "New deployment failed health check"
          REMOTE

          SCRIPT_B64="$(base64 -w0 /tmp/deploy-ec2.sh)"

          REMOTE_COMMAND="echo '$SCRIPT_B64' | base64 -d > /tmp/deploy-ec2.sh && chmod +x /tmp/deploy-ec2.sh && /tmp/deploy-ec2.sh '$IMAGE_URI' '$AWS_REGION' '$AWS_ACCOUNT_ID'"

          PARAMS="$(jq -cn --arg command "$REMOTE_COMMAND" '{commands: [$command]}')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy GitHub commit $GITHUB_SHA" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 36); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || echo Pending)"

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '[StandardOutputContent,StandardErrorContent]' \
                  --output text
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "SSM deployment polling timed out"
          exit 1
