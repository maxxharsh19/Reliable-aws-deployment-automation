
name: Deployment Operations API - CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:

  test:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 02_CODEBASE/app

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated tests
        run: |
          python -m unittest -v test_app.py

  docker-build:
    name: Docker Image Build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t deployment-ops-api:${{ github.sha }} \
            ./02_CODEBASE/app

      - name: Verify Docker image
        run: |
          docker image inspect deployment-ops-api:${{ github.sha }}
