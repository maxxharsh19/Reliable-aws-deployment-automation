
---
- name: Deploy Deployment Operations API on AWS EC2
  hosts: app
  become: true
  gather_facts: true

  vars:
    app_name: deployment-ops-api
    app_dir: /opt/deployment-ops-api
    image_tag: "1.0.0"
    host_port: 80
    container_port: 5000

  tasks:

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy Flask application
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app/app.py"
        dest: "{{ app_dir }}/app.py"
        owner: root
        group: root
        mode: "0644"

    - name: Copy Python dependencies
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app/requirements.txt"
        dest: "{{ app_dir }}/requirements.txt"
        owner: root
        group: root
        mode: "0644"

    - name: Copy Dockerfile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app/Dockerfile"
        dest: "{{ app_dir }}/Dockerfile"
        owner: root
        group: root
        mode: "0644"

    - name: Copy Docker ignore rules
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app/.dockerignore"
        dest: "{{ app_dir }}/.dockerignore"
        owner: root
        group: root
        mode: "0644"

    - name: Build application Docker image
      ansible.builtin.command:
        cmd: "docker build -t {{ app_name }}:{{ image_tag }} {{ app_dir }}"

    - name: Remove previous application container
      ansible.builtin.shell:
        cmd: "docker rm -f {{ app_name }} >/dev/null 2>&1 || true"
        executable: /bin/bash
      changed_when: true

    - name: Start application container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --detach
          - --name
          - "{{ app_name }}"
          - --restart
          - unless-stopped
          - --publish
          - "{{ host_port }}:{{ container_port }}"
          - --env
          - "APP_VERSION={{ image_tag }}"
          - --env
          - APP_ENV=production
          - "{{ app_name }}:{{ image_tag }}"

    - name: Wait for application health
      ansible.builtin.uri:
        url: http://127.0.0.1/health
        method: GET
        status_code: 200
        return_content: true
      register: health_result
      retries: 15
      delay: 4
      until: health_result.status == 200

    - name: Display deployment health
      ansible.builtin.debug:
        var: health_result.json
